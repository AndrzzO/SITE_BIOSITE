[project]
name = "biosite-nfc"
version = "0.1.0"
description = "Plataforma Privada de BioSites com NFC em Django"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "psycopg[binary]>=3.2.0",
]
prod = [
    "psycopg[binary]>=3.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*/migrations/*",
    "media",
    "static",
    "staticfiles",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# Settings do Django utilizam herança por wildcard convencional
"configuracao/settings/*" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["configuracao", "aplicativos"]
