{% load static %}
<div class="sidebar" id="appSidebar">
    <!-- Sidebar Header / Logo -->
    <div class="sidebar-header">
        <a href="{% url 'painel:sites' %}" class="app-brand" title="BioSite NFC — Painel Administrativo">
            <div class="app-icon">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                    <path d="M12 18h.01"></path>
                    <path d="M9 7c1-1 3-1 4 0"></path>
                    <path d="M8 10c2-1.5 5-1.5 7 0"></path>
                </svg>
            </div>
            <span class="app-name">BioSite <span>NFC</span></span>
        </a>
        <button type="button" class="sidebar-close-btn js-sidebar-close" aria-label="Fechar menu lateral">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>

    <!-- Sidebar Navigation List -->
    <ul class="sidebar-list">
        <!-- Dashboard / Meus Sites -->
        <li class="sidebar-list-item {% if request.resolver_match.url_name == 'sites' or request.path == '/painel/' %}active{% endif %}">
            <a href="{% url 'painel:sites' %}" title="Dashboard operacional e listagem de sites">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Dashboard</span>
            </a>
        </li>

        <!-- Clientes -->
        <li class="sidebar-list-item {% if 'clientes' in request.path %}active{% endif %}">
            <a href="{% url 'painel:clientes_lista' %}" title="Gerenciar clientes comerciais">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <span>Clientes</span>
            </a>
        </li>

        <!-- Templates -->
        <li class="sidebar-list-item {% if 'templates' in request.path %}active{% endif %}">
            <a href="{% url 'painel:templates_lista' %}" title="Biblioteca de templates e blocos">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                <span>Templates</span>
            </a>
        </li>

        <!-- NFC / QR Links -->
        <li class="sidebar-list-item {% if 'links' in request.path %}active{% endif %}">
            <a href="{% url 'painel:links_lista' %}" title="Gerenciar tags NFC e QR codes físicos">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
                <span>NFC / QR</span>
            </a>
        </li>

        <!-- Analytics -->
        <li class="sidebar-list-item {% if 'analytics' in request.path %}active{% endif %}">
            <a href="{% url 'painel:analytics_global' %}" title="Métricas e inteligência analítica">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
                <span>Analytics</span>
            </a>
        </li>
    </ul>

    <!-- Bottom Section: User Account & Logout -->
    <div class="account-info">
        <div class="account-info-picture">
            <div class="account-avatar-placeholder">
                {{ request.user.username|slice:":2"|upper }}
            </div>
        </div>
        <div class="account-info-details">
            <div class="account-info-name" title="{{ request.user.get_full_name|default:request.user.username }}">
                {{ request.user.get_full_name|default:request.user.username }}
            </div>
            <div class="account-info-role">Administrador</div>
        </div>
        <form method="post" action="{% url 'painel:logout' %}" class="account-logout-form">
            {% csrf_token %}
            <button type="submit" class="account-logout-btn" title="Encerrar sessão com segurança" aria-label="Sair do painel">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
        </form>
    </div>
</div>
<!-- Backdrop para fechar drawer em dispositivos móveis -->
<div class="sidebar-backdrop js-sidebar-backdrop" aria-hidden="true"></div>
