<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}BioSite NFC — Plataforma{% endblock %}</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --border: #334155;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        header {
            padding: 1.25rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand span {
            color: var(--accent);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        footer {
            padding: 1rem 2rem;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .container {
            max-width: 640px;
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: var(--success);
            border-radius: 50%;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--text-main);
        }

        p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
        }

        .info-item {
            font-size: 0.875rem;
        }

        .info-label {
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .info-val {
            color: var(--text-main);
            font-weight: 600;
        }

        a.btn {
            display: inline-block;
            background-color: var(--accent);
            color: #0f172a;
            font-weight: 600;
            padding: 0.625rem 1.25rem;
            border-radius: 6px;
            text-decoration: none;
            transition: background-color 0.15s ease-in-out;
        }

        a.btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <a href="{% url 'core:home' %}" class="brand">
            BioSite <span>NFC</span>
        </a>
        <div style="display: flex; align-items: center; gap: 0.5rem;">
            {% if request.user.is_authenticated %}
                <a href="{% url 'painel:sites' %}" class="btn" style="padding: 0.35rem 0.75rem; font-size: 0.75rem;">Dashboard &rarr;</a>
            {% else %}
                <a href="{% url 'painel:login' %}" class="btn" style="padding: 0.35rem 0.75rem; font-size: 0.75rem;">Entrar no Painel &rarr;</a>
            {% endif %}
            <a href="/health/" class="btn" style="padding: 0.35rem 0.75rem; font-size: 0.75rem; background: transparent; border: 1px solid var(--border); color: var(--text-muted);" target="_blank">Health Check</a>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        &copy; {% now "Y" %} Plataforma BioSite NFC &bull; Monólito Modular Django
    </footer>
    {% block extra_js %}{% endblock %}
</body>
</html>
