<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Negado (403) — BioSite NFC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
        }
        .card {
            background-color: #151d30;
            border: 1px solid #26334d;
            padding: 3rem 2.5rem;
            border-radius: 14px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        h1 { color: #ef4444; font-size: 3rem; margin-bottom: 0.5rem; font-weight: 800; }
        h2 { font-size: 1.375rem; margin-bottom: 0.75rem; color: #f8fafc; }
        p { color: #94a3b8; margin-bottom: 2rem; font-size: 0.9375rem; line-height: 1.6; }
        .btn-group { display: flex; gap: 1rem; justify-content: center; }
        a.btn {
            background-color: #38bdf8;
            color: #0b0f19;
            font-weight: 600;
            padding: 0.625rem 1.25rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9375rem;
        }
        a.btn-sec {
            background-color: transparent;
            border: 1px solid #26334d;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>403</h1>
        <h2>Acesso Negado</h2>
        <p>Apenas operadores administrativos ativos possuem autorização para acessar esta área da plataforma.</p>
        <div class="btn-group">
            <a href="/painel/login/" class="btn">Fazer Login</a>
            <a href="/" class="btn btn-sec">Página Inicial</a>
        </div>
    </div>
</body>
</html>
